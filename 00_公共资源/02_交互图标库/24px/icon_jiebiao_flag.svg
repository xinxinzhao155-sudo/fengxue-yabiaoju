<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="24" height="24" role="img" aria-labelledby="title"><title id="title">接镖令旗 · 绢本工笔 </title><defs><filter id="optical-stamp" color-interpolation-filters="sRGB"><feComponentTransfer><feFuncR type="linear" slope="1.000000" intercept="0.000000" /><feFuncG type="linear" slope="1.000000" intercept="0.000000" /><feFuncB type="linear" slope="1.000000" intercept="0.000000" /></feComponentTransfer></filter><filter id="small-ink" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB"><feComponentTransfer><feFuncR type="linear" slope="0.971963" intercept="0.028037" /><feFuncG type="linear" slope="0.971963" intercept="0.028037" /><feFuncB type="linear" slope="0.971963" intercept="0.028037" /></feComponentTransfer></filter><filter id="optical-tune" color-interpolation-filters="sRGB"><feComponentTransfer><feFuncR type="linear" slope="0.966537" intercept="0.033463" /><feFuncG type="linear" slope="0.966537" intercept="0.033463" /><feFuncB type="linear" slope="0.966537" intercept="0.033463" /></feComponentTransfer></filter><filter id="silk-on-ink" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
