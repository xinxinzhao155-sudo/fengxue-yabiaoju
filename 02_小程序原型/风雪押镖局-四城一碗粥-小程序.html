<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="">
  <title>風雪押鏢局 · 大冰的小屋</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/fonts/standard-kai.css">
  <link rel="stylesheet" href="assets/public/base_style.css">
  <link rel="stylesheet" href="css/theme-adapter.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/film-preview.css">
  <script defer src="js/vendor/opencc-cn2t.js"></script>
  <script defer src="js/traditional.js"></script>
  <script defer src="js/sop-content.js"></script>
  <!-- 如需临时覆盖分舵字段或图标，可在适配层之前注入 ESCORT_SHARED_DATA。 -->
  <script defer src="js/data-adapter.js"></script>
  <script defer src="js/storage.js"></script>
  <script defer src="js/views.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <header class="desktop-header">
    <div class="brand"><span class="brand-seal" aria-hidden="true">鏢</span><span>大冰的小屋<small>風雪押鏢局</small></span></div>
    <span class="desktop-meta"><i></i> 臘八四城聯動</span>
  </header>
  <main class="showcase">
    <aside class="intro" aria-label="活動介紹">
      <p class="intro-kicker"><span></span> 四城共熬一碗粥</p>
      <h1>風雪<br>押鏢局<span>。</span></h1>
      <p class="intro-copy">一碗熱粥暖皮囊，一首民謠暖魂靈。<br>粥熬百味，歌敬異鄉。</p>
      <ol class="intro-steps">
        <li><span>一</span> 木架領牒，走完本城三關</li>
        <li><span>二</span> 木匣響鈴，撕票貼入文牒</li>
        <li><span>三</span> 一印三票，到吧檯交鏢</li>
      </ol>
    </aside>

    <section class="phone" aria-label="風雪押鏢局小程序">
      <div class="status-bar" aria-hidden="true"><b>9:41</b><div id="status-icons"></div></div>
      <header class="mini-header">
        <button class="icon-button mini-back" type="button" data-action="back" aria-label="返回鏢局" hidden></button>
        <strong id="mini-title">風雪押鏢局</strong>
        <button class="icon-button sound-control" id="sound-control" type="button" data-action="sound" aria-label="木匣提示音" aria-pressed="false"></button>
        <div class="capsule">
          <button type="button" data-action="about" aria-label="玩法說明" id="about-icon"></button>
          <button type="button" data-action="home" aria-label="返回首頁" id="home-icon"></button>
        </div>
      </header>
      <div id="screen" class="screen" tabindex="-1"></div>
      <nav id="tabs" class="tabs" aria-label="小程序導航"></nav>
      <dialog id="sheet" class="sheet" aria-labelledby="sheet-title"></dialog>
      <div id="toast" class="toast" role="status" aria-atomic="true"></div>
      <div id="flight" class="flight" aria-hidden="true" hidden></div>
    </section>

    <aside class="demo-area" aria-label="路演控制檯">
      <details class="demo" open>
        <summary id="demo-summary">路演控制檯</summary>
        <div id="demo-controls" class="demo-controls"></div>
      </details>
      <p class="demo-note" id="save-note"></p>
    </aside>
  </main>
</body>
</html>
